services:
  postgres:
    # Sprint 6b: switched to the official pgvector image (Postgres 16 base)
    # so the migration ``0010_retrieval_eval_indexes`` can ``CREATE
    # EXTENSION vector`` for the Naive-RAG / GraphRAG retrieval indexes.
    # Same on-disk layout as ``postgres:16-alpine`` -> existing ``pgdata``
    # volume is preserved without re-ingesting.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zkast
      POSTGRES_PASSWORD: zkast
      POSTGRES_DB: zkast
    ports:
      # Host access for local tools / pytest (services inside Compose still use hostname `postgres`).
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zkast -d zkast"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  falkordb:
    image: falkordb/falkordb:latest
    # FalkorDB exposes Redis protocol (working graph engine for Graphiti).
    ports:
      # Avoid clash with host-mapped Redis above (both use 6379 in-container).
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ./apps/migrations
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Inside Compose the DB is reachable at service name `postgres`, not localhost.
      DATABASE_URL: postgresql://zkast:zkast@postgres:5432/zkast
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  pipeline:
    build:
      context: ./apps/pipeline
      dockerfile: Dockerfile
    env_file: .env
    environment:
      GRAPHITI_TELEMETRY_ENABLED: "false"
      EMBEDDING_DIM: "1536"
      # Graphiti LLM/embed/rerank concurrency; lower reduces Cohere 429s (see specs/techstack.md).
      SEMAPHORE_LIMIT: "10"
      DATABASE_URL: postgresql://zkast:zkast@postgres:5432/zkast
      REDIS_URL: redis://redis:6379/0
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      GRAPHRAG_STORAGE_DIR: /var/zkast/graphrag
    ports:
      # Host access when Next.js runs via `pnpm dev` (PIPELINE_INTERNAL_URL=http://127.0.0.1:8000).
      - "8000:8000"
    expose:
      - "8000"
    volumes:
      - pipeline_storage:/var/zkast/storage
      - graphrag_storage:/var/zkast/graphrag
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./apps/pipeline
      dockerfile: Dockerfile
    command: ["arq", "app.tasks.WorkerSettings"]
    env_file: .env
    environment:
      GRAPHITI_TELEMETRY_ENABLED: "false"
      EMBEDDING_DIM: "1536"
      # Per-graph-job Cohere concurrency. Kept low so a bulk import's many
      # concurrent graph jobs don't exceed Cohere's rate limit (which also
      # throttles grounded chat running on this same worker).
      SEMAPHORE_LIMIT: "4"
      # Max concurrent arq jobs (graph extraction, notes, chat turns).
      WORKER_MAX_JOBS: "4"
      DATABASE_URL: postgresql://zkast:zkast@postgres:5432/zkast
      REDIS_URL: redis://redis:6379/0
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    volumes:
      - pipeline_storage:/var/zkast/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Dedicated worker for interactive grounded-chat turns. Runs on its own arq
  # queue so chat is never stuck behind bulk ingestion (Slack/PDF/North) jobs.
  chat-worker:
    build:
      context: ./apps/pipeline
      dockerfile: Dockerfile
    command: ["arq", "app.tasks.ChatWorkerSettings"]
    env_file: .env
    environment:
      GRAPHITI_TELEMETRY_ENABLED: "false"
      EMBEDDING_DIM: "1536"
      SEMAPHORE_LIMIT: "6"
      CHAT_WORKER_MAX_JOBS: "4"
      DATABASE_URL: postgresql://zkast:zkast@postgres:5432/zkast
      REDIS_URL: redis://redis:6379/0
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    volumes:
      - pipeline_storage:/var/zkast/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Dedicated worker for MS GraphRAG batch indexing. Its own image (graphrag +
  # openai 2.x) isolated from the main pipeline's openai<2 deps, consuming the
  # arq:queue:graphrag queue. Runs the graphiti-free app.graphrag_tasks worker.
  graphrag-worker:
    build:
      context: ./apps/pipeline
      dockerfile: Dockerfile.graphrag
    command: ["arq", "app.graphrag_tasks.GraphragWorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://zkast:zkast@postgres:5432/zkast
      REDIS_URL: redis://redis:6379/0
      GRAPHRAG_STORAGE_DIR: /var/zkast/graphrag
      GRAPHRAG_WORKER_MAX_JOBS: "1"
    volumes:
      - graphrag_storage:/var/zkast/graphrag
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://zkast:zkast@postgres:5432/zkast
      PIPELINE_INTERNAL_URL: http://pipeline:8000
    depends_on:
      pipeline:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  pgdata:
  pipeline_storage:
  graphrag_storage:

# Optional (uncomment): observability profile
# profiles: [observability]
# services:
#   otel-collector:
#     image: otel/opentelemetry-collector:latest
#     ...
