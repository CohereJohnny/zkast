services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zkast
      POSTGRES_PASSWORD: zkast
      POSTGRES_DB: zkast
    ports:
      # Host access for local tools / pytest (services inside Compose still use hostname `postgres`).
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zkast -d zkast"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  falkordb:
    image: falkordb/falkordb:latest
    # FalkorDB exposes Redis protocol (working graph engine for Graphiti).
    ports:
      # Avoid clash with host-mapped Redis above (both use 6379 in-container).
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ./apps/migrations
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  pipeline:
    build:
      context: ./apps/pipeline
      dockerfile: Dockerfile
    env_file: .env
    environment:
      GRAPHITI_TELEMETRY_ENABLED: "false"
      EMBEDDING_DIM: "1536"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      pipeline:
        condition: service_healthy

volumes:
  pgdata:

# Optional (uncomment): observability profile
# profiles: [observability]
# services:
#   otel-collector:
#     image: otel/opentelemetry-collector:latest
#     ...
