# GraphRAG 3.1.0 config — Cohere via its OpenAI-compatibility endpoint.
# Run: GRAPHRAG_API_KEY=<cohere key> ../.venv/bin/python ../run_spike.py cohere
#
# OPEN RISK (verify in a live run): Cohere's /compatibility/v1 endpoint serves
# chat completions; embeddings support through litellm's openai provider is the
# #1 thing to confirm. If embeddings fail here, either point embedding_models at
# OpenAI (mixed providers) or use Cohere-native embeddings via a custom model.

completion_models:
  default_completion_model:
    model_provider: openai
    model: command-a-plus-05-2026
    api_base: https://api.cohere.com/compatibility/v1
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    model_supports_json: true
    retry:
      type: exponential_backoff

embedding_models:
  default_embedding_model:
    model_provider: openai
    model: embed-v4.0
    api_base: https://api.cohere.com/compatibility/v1
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    # Cohere's compat /embeddings need encoding_format=float to avoid graphrag's
    # fixed-size arrow assembly error (issue #2194). NOTE: index/query dim
    # mismatch (3072 vs 1536) remains, and litellm blocks the `dimensions` param
    # on this path — see README "Findings". Recommended: use OpenAI for the
    # embedding model (chat can stay Cohere-compat). Embeddings here are NOT
    # fully working; this config is kept to document the chat-side success.
    call_args:
      encoding_format: float
    retry:
      type: exponential_backoff

input:
  type: text

input_storage:
  type: file
  base_dir: "../fixture/input"

output_storage:
  type: file
  base_dir: "output"

cache:
  type: json
  storage:
    type: file
    base_dir: "cache"

vector_store:
  type: lancedb
  db_uri: "output/lancedb"

# Domain-tuned entity types (vs the graphrag default org/person/geo/event).
extract_graph:
  entity_types: [organization, person, geo, event, standard, equipment, process, material]
  max_gleanings: 1
