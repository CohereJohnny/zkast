# Fair engine compare: locked generic_v1 ontology on both sides.
# Graphiti (live extraction + Falkor) vs MS GraphRAG (batch index + communities).
name: harness-graphiti-vs-graphrag
description: >-
  Fair Graphiti vs MS GraphRAG harness: same memory space, generic_v1 ontology.
  Graphiti uses graphiti_falkor + graph retrieval; MS GraphRAG uses
  graphrag_artifacts + ms_graphrag global search over community reports.
is_builtin: true
version: 1
extractor: graphiti
ontology_version: generic_v1
graph_store: graphiti_falkor
retrieval_strategy: graph
provider: cohere_compat
params:
  harness_role: graphiti_baseline
  compare_with:
    name: harness-graphiti-vs-graphrag-ms
    extractor: graphrag
    ontology_version: generic_v1
    graph_store: graphrag_artifacts
    retrieval_strategy: ms_graphrag
