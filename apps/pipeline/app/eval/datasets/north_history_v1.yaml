name: north_history_v1
version: "1"
description: >
  Synthetic North-style agent memory eval set. Pattern scores tolerate empty
  retrieval when the workspace has no matching agent-scoped embeddings yet.
questions:
  - key: nh_single_hop_1
    category: single_hop
    ability_type: single_hop_fact
    question_text: What internal codename was used for the memory pivot project?
    expected_answer_patterns:
      - north a-mem pivot
      - north amem pivot
    expected_entity_ids: []
    expected_source_ids: []
    expected_context_patterns:
      - pivot
    refusal_expected: false
    notes: Requires imported North transcript or notes containing the phrase.

  - key: nh_multi_hop_1
    category: multi_hop
    ability_type: multi_hop_reasoning
    question_text: Which subsystem owns conversation ingestion before notes are generated?
    expected_answer_patterns:
      - parse
      - transcript
      - ingestion
    expected_entity_ids: []
    expected_source_ids: []
    expected_context_patterns:
      - episode
      - ingest
    refusal_expected: false

  - key: nh_temporal_1
    category: temporal
    ability_type: temporal_reasoning
    question_text: After the dreaming job runs, which field records when a note was last touched by dreaming?
    expected_answer_patterns:
      - dreaming_touched_at
      - dreaming touched
    expected_entity_ids: []
    expected_source_ids: []
    expected_context_patterns:
      - dream
    refusal_expected: false

  - key: nh_tool_provenance_1
    category: tool_provenance
    ability_type: source_provenance
    question_text: Which message classes are excluded by default in North transcript filters?
    expected_answer_patterns:
      - system
    expected_entity_ids: []
    expected_source_ids: []
    expected_context_patterns:
      - system
      - filter
    refusal_expected: false

  - key: nh_unanswerable_1
    category: unanswerable
    ability_type: abstention
    question_text: What is the secret API key for the North staging tenant?
    expected_answer_patterns: []
    expected_entity_ids: []
    expected_source_ids: []
    refusal_expected: true

  - key: nh_single_hop_2
    category: single_hop
    ability_type: single_hop_fact
    question_text: What does A-MEM stand for in the North memory track?
    expected_answer_patterns:
      - agentic memory
      - a-mem
      - amem
    expected_entity_ids: []
    expected_source_ids: []
    expected_context_patterns:
      - agentic
    refusal_expected: false
    notes: Answer may come from imported notes or transcript mentioning agentic memory.

  - key: nh_multi_hop_2
    category: multi_hop
    ability_type: multi_hop_reasoning
    question_text: Which retrieval index kind stores Zettel-style note embeddings separate from A-MEM?
    expected_answer_patterns:
      - note_zettel
      - zettel
    expected_entity_ids: []
    expected_source_ids: []
    expected_context_patterns:
      - note_zettel
    refusal_expected: false

  - key: nh_temporal_2
    category: temporal
    ability_type: temporal_reasoning
    question_text: When a dream job finishes successfully, what status value is stored on the dream_jobs row?
    expected_answer_patterns:
      - succeeded
    expected_entity_ids: []
    expected_source_ids: []
    expected_context_patterns:
      - dream
      - succeeded
    refusal_expected: false

  - key: nh_agent_scope_1
    category: agent_scope
    ability_type: agent_scope_isolation
    question_text: When agent scope is set, should retrieval blend notes from other North agents?
    expected_answer_patterns:
      - no
      - not
      - isolate
      - scoped
    expected_entity_ids: []
    expected_source_ids: []
    expected_context_patterns:
      - agent
    refusal_expected: false
